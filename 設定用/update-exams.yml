name: 更新考古題題庫

on:
  schedule:
    - cron: '17 */6 * * *'      # 每 6 小時一次（UTC）；全部抓完後，沒有新試卷時幾秒就結束
  workflow_dispatch:             # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

concurrency:
  group: exam-bank
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝工具
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q pdfplumber scikit-learn   # scikit-learn：推定「這題在考哪一條」

      - name: 更新考選部清單（有設定 CSV_URL 才會更新，失敗就沿用舊清單）
        if: ${{ vars.CSV_URL != '' }}
        env:
          CSV_URL: ${{ vars.CSV_URL }}
        run: |
          if curl -fsSL --retry 3 -o /tmp/list.csv "$CSV_URL" && head -c 300 /tmp/list.csv | grep -q "考試年度"; then
            gzip -9 -c /tmp/list.csv > data/ExamQandA_Csv.csv.gz && echo "清單已更新"
          else
            echo "清單下載失敗，沿用舊清單"
          fi

      - name: 抓題與解析（每次最多 290 分鐘，跑不完下次接著跑）
        run: |
          python3 -u tools/exam_pipeline.py --csv data/ExamQandA_Csv.csv.gz --laws laws/index.json \
            --out docs/exams --minutes 290 --sleep 1   # 留時間給統計（約 8 分鐘）
          touch docs/.nojekyll

      - name: 存回專案（GitHub Pages 會自動更新網站）
        run: |
          git config user.name "exam-bot"
          git config user.email "exam-bot@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -q -m "題庫更新 $(date -u +%F)"
          # 法規排程可能同時在推送：衝突時等一下再試，最多 5 次，避免整次的成果白做
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            echo "推送衝突，重試 $i"; sleep 20
          done
          echo "::error::推送失敗 5 次，這次的成果沒有存回專案，下次排程會重做"; exit 1
